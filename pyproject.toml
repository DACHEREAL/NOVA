[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-os-agent"
version = "0.1.0"
description = "N.O.V.A. (Native Operating Vector Assistant): Cross-Platform, Privacy-First Autonomous OS Agent"
readme = "README.md"
authors = [{ name = "N.O.V.A. Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.17.0",
    "sounddevice>=0.4.6",
    "lancedb>=0.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
macos = [
    "pyobjc-framework-ApplicationServices>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-LocalAuthentication>=10.0",
    "mlx>=0.16.0; platform_machine == 'arm64'",
]
windows = [
    "pywin32>=306",
    "comtypes>=1.4.0",
]
linux = [
    "pyatspi>=2.38.0",
    "python-xlib>=0.33",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
]

[project.scripts]
nova = "nova.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nova*"]

